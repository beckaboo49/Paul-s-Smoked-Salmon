<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul's - Highway 101 Location</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0D1117;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .map-wrapper {
      width: 100%;
      border: 1px solid #30363D;
      background-color: #161B22;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }
    .map-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="map-wrapper">
      <img src="/map.svg" alt="Southbound Highway 101 Corridor Map to Paul's in Klamath, California">
    </div>
  </div>

</body>
</html>
